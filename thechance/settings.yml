# TheChance Search (search.thechance.family) settings for the KN4OQW fork.
# Deployed to /etc/searxng/settings.yml on CT 101. The secret key is NOT in this
# file: it comes from SEARXNG_SECRET in /etc/searxng/searxng.env on the host.

use_default_settings: true

general:
  debug: false
  instance_name: "TheChance Search"
  privacypolicy_url: false
  # Required since upstream PR #6870: Wikipedia, Wikidata and OpenStreetMap are
  # disabled without it, and it is sent in their User-Agent per Wikimedia policy.
  contact_url: "https://search.thechance.family/"

server:
  base_url: "https://search.thechance.family/"
  bind_address: "0.0.0.0"
  port: 8888
  # Cloudflare and CrowdSec on NPMplus protect the public side; the SearXNG
  # limiter only produced false 429s behind Cloudflare.
  limiter: false
  image_proxy: true

valkey:
  url: "valkey://localhost:6379/0"

ui:
  static_use_hash: true

search:
  safe_search: 2
  autocomplete: "google"
  # DuckDuckGo answers every request with a CAPTCHA when the language is "all"
  # (upstream issue #6779).
  default_lang: "en-US"
  formats:
    - html
    - json
  # Upstream defaults are 180 s, which keeps hitting engines that already block us.
  suspended_times:
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 21600
    SearxEngineTooManyRequests: 1800

# TheChance fork: per-engine result cache in Valkey (searx/search/engine_cache.py).
# Fresh for `ttl`, then served stale + refreshed in the background until
# ttl * revalidate_factor; any answer up to fallback_max_age is served when an
# engine is suspended or fails. Counters: HGETALL sxng:ec:stats:<engine>
engine_cache:
  enabled: true
  # Streaming results: the HTML page renders after `first_paint` seconds with
  # what has arrived (cache hits are instant); thechance-stream.js polls for the
  # engines still running. The JSON API always waits for every engine.
  stream: true
  first_paint: 0.6
  ttl: 21600                 # 6 h for general web results
  revalidate_factor: 4
  fallback_max_age: 604800   # 7 days
  categories:
    news: 900                # 15 min
    videos: 21600
    images: 43200
    it: 43200
    science: 86400
    map: 86400
  engines:
    wikipedia: 86400
    wikidata: 86400
    # Our own index changes only when we crawl; still cheap to ask again.
    yacy: 3600

# TheChance fork ranking (searx/ranking.py): bounded multipliers instead of
# upstream's "high priority ignores position, low priority scores zero".
ranking:
  enabled: true
  agreement_bonus: 0.25
  high_priority_factor: 1.5
  low_priority_factor: 0.5
  fresh_days: 7
  fresh_boost: 0.3
  # The search gateway's host scoreboard (Valkey DB 1): sites Claude uses.
  site_prior_url: "valkey://localhost:6379/1"
  site_prior_key: "gw:dom:score"
  site_prior_max: 0.3
  per_host: 2
  window: 10

# TheChance fork click signals (searx/clicks.py): result clicks and quick returns
# are reported by thechance-signals.js; clicked pages are checked in the
# background. Read back by searx/ranking.py (dead pages x0.01, frequent bounces
# down to x0.5, clicks up to +20%). Stored in the gateway's Valkey DB 1.
clicks:
  enabled: true
  valkey_url: "valkey://localhost:6379/1"
  click_host_points: 2
  bounce_seconds: 15
  dead_days: 3
  recheck_hours: 6

plugins:
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true

# Rank official docs and good technical sources up, low-value sites down.
hostnames:
  high_priority:
    - '(.*\.)?api\.flutter\.dev$'
    - '(.*\.)?docs\.flutter\.dev$'
    - '(.*\.)?pub\.dev$'
    - '(.*\.)?dart\.dev$'
    - '(.*\.)?riverpod\.dev$'
    - '(.*\.)?developers\.cloudflare\.com$'
    - '(.*\.)?pve\.proxmox\.com$'
    - '(.*\.)?goteleport\.com$'
    - '(.*\.)?docs\.ansible\.com$'
    - '(.*\.)?weather\.gov$'
    - '(.*\.)?docs\.python\.org$'
    - '(.*\.)?developer\.mozilla\.org$'
    - '(.*\.)?developer\.android\.com$'
    - '(.*\.)?developer\.apple\.com$'
    - '(.*\.)?github\.com$'
    - '(.*\.)?stackoverflow\.com$'
    - '(.*\.)?wikipedia\.org$'
  low_priority:
    - '(.*\.)?pinterest\.[a-z.]+$'
    - '(.*\.)?quora\.com$'
    - '(.*\.)?geeksforgeeks\.org$'
    - '(.*\.)?w3schools\.com$'
    - '(.*\.)?medium\.com$'

engines:
  # Our own index: YaCy on CT 114, crawled from the domains our searches return
  # (search-gateway seeds it). Local mode searches only our index, so it is
  # fast; LAN only, plain HTTP.
  - name: yacy
    engine: yacy
    categories: general
    search_type: text
    base_url: "http://172.16.50.114:8090"
    shortcut: ya
    disabled: false
    enable_http: true
    search_mode: local
    timeout: 2.0

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    display_error_messages: true

  # Ranking weights (merged by name into the upstream definitions). YaCy starts
  # low: its index is small and young, and it answers first, so without this it
  # owns the first paint. Raise it as the index grows.
  - name: yacy
    weight: 0.6
  - name: google
    weight: 1.2
  - name: brave
    weight: 1.2
